name: Security Scan
description: Run IaC, dependency-CVE, secret, SAST, Dockerfile and image security scans via pinned docker images
inputs:
  enforce:
    description: When "true", non-secret findings at HIGH/CRITICAL fail the job. Secret hits always fail.
    required: false
    default: "false"
  mode:
    description: Which scans to run - "all", "source" (IaC, SCA, secrets, SAST, Dockerfile, source SBOM) or "image" (image CVEs + image SBOM only). Use "image" for a post-build step so the source scans are not repeated.
    required: false
    default: "all"
  scan-image:
    description: When "true" and image-ref is set, also scan the already-built container image (trivy image CVEs + image SBOM). Dockerfile lint and the source SBOM do not need this - they always run.
    required: false
    default: "false"
  image-ref:
    description: Image reference to scan when scan-image is "true". Must already exist - pass duplo-build's image_uri output rather than rebuilding.
    required: false
    default: ""
  path:
    description: Path to scan for IaC, secrets, and SAST.
    required: false
    default: "."
  report-dir:
    description: Directory to write scan reports into.
    required: false
    default: "scan-reports"
outputs:
  result:
    description: Overall scan result (pass or fail)
    value: ${{ steps.scan.outputs.result }}
runs:
  using: composite
  steps:

  - name: Security Scan
    id: scan
    shell: bash
    env:
      MODE: ${{ inputs.mode }}
      ENFORCE: ${{ inputs.enforce }}
      SCAN_IMAGE: ${{ inputs.scan-image }}
      IMAGE_REF: ${{ inputs.image-ref }}
      SCAN_PATH: ${{ inputs.path }}
      REPORT_DIR: ${{ inputs.report-dir }}
    run: $GITHUB_ACTION_PATH/scan.sh
