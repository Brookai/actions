name: Security Scan
description: Run IaC, dependency-CVE, secret, SAST, Dockerfile and image security scans via pinned docker images
inputs:
  enforce:
    description: When "true", non-secret findings and scanner failures fail the job. Secret hits always fail regardless.
    required: false
    default: "false"
  mode:
    description: Which scans to run - "all", "source" (IaC, SCA, secrets, SAST, Dockerfile lint, source SBOM) or "image" (image CVEs + image SBOM only). Use "image" for a post-build step so the source scans are not repeated. "both" and "iac" are accepted as aliases of "all" and "source", matching the sibling wiz-scan vocabulary.
    required: false
    default: "all"
  scan-image:
    description: When "true" and image-ref is set, also scan the already-built container image (trivy image CVEs + image SBOM). Note this only has an effect while the image half is running - in mode "source" nothing image-related runs, and in mode "image" nothing else does.
    required: false
    default: "false"
  image-ref:
    description: Image reference to scan when scan-image is "true". Must already exist - pass duplo-build's image_uri output rather than rebuilding.
    required: false
    default: ""
  path:
    description: Path to scan for IaC, secrets, and SAST.
    required: false
    default: "."
  report-dir:
    description: Directory (inside the workspace) the scan reports are copied to when the run finishes. Scanning itself happens against a directory outside the tree so no scanner reads another's output.
    required: false
    default: "scan-reports"
outputs:
  result:
    description: Overall scan result (pass or fail)
    value: ${{ steps.scan.outputs.result }}
  tool-errors:
    description: Number of scanners that failed to run. These are NOT findings - that coverage is simply missing from the result. Non-zero with result=pass means the scan was incomplete.
    value: ${{ steps.scan.outputs.tool-errors }}
runs:
  using: composite
  steps:

  - name: Security Scan
    id: scan
    shell: bash
    env:
      MODE: ${{ inputs.mode }}
      ENFORCE: ${{ inputs.enforce }}
      SCAN_IMAGE: ${{ inputs.scan-image }}
      IMAGE_REF: ${{ inputs.image-ref }}
      SCAN_PATH: ${{ inputs.path }}
      REPORT_DIR: ${{ inputs.report-dir }}
    run: $GITHUB_ACTION_PATH/scan.sh
